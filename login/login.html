
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login</title>
    <link rel="stylesheet" href="style.css">
    <script src="script.js" defer></script>
</head>
<body>

    <div class="container">
       <form id="loginForm">

    <input
        type="text"
        id="loginUsername"
        placeholder="Username"
        required
    >

    <input
        type="password"
        id="loginPassword"
        placeholder="Password"
        required
    >

    <button type="submit">
        Login
    </button>

    <p id="loginMessage"></p>

</form>
    </div>

</body>
</html>
