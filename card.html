<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Signup</title>
    <link rel="stylesheet" href="signup.css">
</head>
<style>
* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
    font-family: Arial, sans-serif;
}

body {
    min-height: 100vh;
    display: flex;
    justify-content: center;
    align-items: center;
    background: linear-gradient(135deg, #667eea, #764ba2);
}

.signup-box {
    width: 400px;
    background: white;
    padding: 35px;
    border-radius: 15px;
    box-shadow: 0 10px 30px rgba(0, 0, 0, 0.2);
}

h2 {
    text-align: center;
    margin-bottom: 8px;
    color: #333;
}

.subtitle {
    text-align: center;
    color: #777;
    margin-bottom: 25px;
}

.input-box {
    margin-bottom: 16px;
}

.input-box label {
    display: block;
    margin-bottom: 6px;
    font-weight: bold;
    color: #333;
}

.input-box input {
    width: 90%;
    padding: 12px;
    border: 1px solid #ccc;
    border-radius: 7px;
    font-size: 15px;
    outline: none;
}

.input-box input:focus {
    border-color: #667eea;
}

.input-box span {
    display: block;
    color: red;
    font-size: 12px;
    margin-top: 4px;
    min-height: 14px;
}

button {
    width: 100%;
    padding: 13px;
    border: none;
    border-radius: 7px;
    background: #667eea;
    color: white;
    font-size: 16px;
    cursor: pointer;
}

button:hover {
    background: #5568d9;
}

#success {
    text-align: center;
    color: green;
    margin-top: 15px;
    font-weight: bold;
}

.login {
    text-align: center;
    margin-top: 20px;
    color: #666;
}

.login a {
    color: #667eea;
    text-decoration: none;
    font-weight: bold;
}

/* Mobile */
@media (max-width: 500px) {

    .signup-box {
        width: 90%;
        padding: 25px;
    }

} 
</style>
<body>

    <div class="signup-box">

        <h2>Create Account</h2>
        <p class="subtitle">Sign up to create your account</p>

        <form id="signupForm">

            <div class="input-box">
                <label>Full Name</label>
                <input type="text" id="name" placeholder="Enter your name">
                <span id="nameError"></span>
            </div>

            <div class="input-box">
                <label>Email</label>
                <input type="email" id="email" placeholder="Enter your email">
                <span id="emailError"></span>
            </div>

            <div class="input-box">
                <label>Phone Number</label>
                <input type="text" id="phone" placeholder="Enter phone number">
                <span id="phoneError"></span>
            </div>

            <div class="input-box">
                <label>Password</label>
                <input type="password" id="password" placeholder="Enter password">
                <span id="passwordError"></span>
            </div>

            <div class="input-box">
                <label>Confirm Password</label>
                <input type="password" id="confirmPassword" placeholder="Confirm password">
                <span id="confirmError"></span>
            </div>

            <button type="submit">Sign Up</button>

            <p id="success"></p>

            <p class="login">
                Already have an account?
                <a href="login.html">Login</a>
            </p>

        </form>
  <iframe
        src="https://www.google.com/maps/embed?pb=YOUR_MAP_CODE"
        width="100%"
        height="400"
        style="border:0;"
        allowfullscreen=""
        loading="lazy"
        referrerpolicy="no-referrer-when-downgrade">
    </iframe>
    </div>

    <script src="signup.js"></script>
<script>
    
const form = document.getElementById("signupForm");

form.addEventListener("submit", function (event) {

    event.preventDefault();

    // Get values
    const name = document.getElementById("name").value.trim();
    const email = document.getElementById("email").value.trim();
    const phone = document.getElementById("phone").value.trim();
    const password = document.getElementById("password").value;
    const confirmPassword = document.getElementById("confirmPassword").value;

    // Error elements
    const nameError = document.getElementById("nameError");
    const emailError = document.getElementById("emailError");
    const phoneError = document.getElementById("phoneError");
    const passwordError = document.getElementById("passwordError");
    const confirmError = document.getElementById("confirmError");
    const success = document.getElementById("success");

    // Clear old messages
    nameError.textContent = "";
    emailError.textContent = "";
    phoneError.textContent = "";
    passwordError.textContent = "";
    confirmError.textContent = "";
    success.textContent = "";

    let valid = true;

    // Name validation
    if (name === "") {
        nameError.textContent = "Name is required";
        valid = false;
    }

    // Email validation
    const emailPattern = /^[^\s@]+@[^\s@]+\.[^\s@]+$/;

    if (email === "") {
        emailError.textContent = "Email is required";
        valid = false;
    }
    else if (!emailPattern.test(email)) {
        emailError.textContent = "Enter a valid email";
        valid = false;
    }

    // Phone validation
    const phonePattern = /^[0-9]{10}$/;

    if (phone === "") {
        phoneError.textContent = "Phone number is required";
        valid = false;
    }
    else if (!phonePattern.test(phone)) {
        phoneError.textContent = "Enter 10 digit phone number";
        valid = false;
    }

    // Password validation
    if (password === "") {
        passwordError.textContent = "Password is required";
        valid = false;
    }
    else if (password.length < 6) {
        passwordError.textContent = "Password must be at least 6 characters";
        valid = false;
    }

    // Confirm password
    if (confirmPassword === "") {
        confirmError.textContent = "Confirm your password";
        valid = false;
    }
    else if (password !== confirmPassword) {
        confirmError.textContent = "Passwords do not match";
        valid = false;
    }

    // Success
    if (valid) {

        success.textContent = "Signup successful!";

        form.reset();
    }

});


</script>
</body>
</html>
