<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Dynamic Card Display</title>
    <link rel="stylesheet" href="style.css">
    <style>
        body {
    font-family: Arial, sans-serif;
    background-color: #f4f4f9;
    padding: 20px;
}

/* Container rules to align cards next to each other */
.card-container {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));
    gap: 20px;
    max-width: 1200px;
    margin: 0 auto;
}

/* Individual card styling */
.card {
    background: #ffffff;
    border-radius: 8px;
    overflow: hidden;
    box-shadow: 0 4px 8px rgba(0, 0, 0, 0.1);
    transition: transform 0.2s ease-in-out;
}

.card:hover {
    transform: translateY(-5px);
}

.card-img {
    width: 100%;
    height: 180px;
    object-fit: cover;
}

.card-body {
    padding: 15px;
}

.card-title {
    margin: 0 0 10px 0;
    font-size: 1.25rem;
    color: #333;
}

.card-text {
    font-size: 0.9rem;
    color: #666;
    line-height: 1.4;
    margin-bottom: 15px;
}

.card-btn {
    display: inline-block;
    padding: 8px 16px;
    background-color: #007bff;
    color: #fff;
    text-decoration: none;
    border-radius: 4px;
    font-size: 0.85rem;
}

.card-btn:hover {
    background-color: #0056b3;
}

    </style>
</head>
<body>

    <!-- Container where cards will be rendered -->
    <div id="card-container" class="card-container"></div>

    <script >
        // Step 1: Store data in an array of objects
const cardData = [
    {
        title: "Mountain Adventure",
        image: "https://picsum.photos",
        description: "Explore the beautiful, serene peaks and rough terrains.",
        link: "#"
    },
    {
        title: "Ocean Breeze",
        image: "https://picsum.photos",
        description: "Relax by the crystal clear waters and golden sand beaches.",
        link: "#"
    },
    {
        title: "Forest Path",
        image: "https://picsum.photos",
        description: "Get lost in nature while walking through majestic green forests.",
        link: "#"
    }
];

// Step 2: Select the container element from the DOM
const container = document.getElementById('card-container');

// Step 3: Loop through the array and generate HTML for each object
cardData.forEach((item) => {
    // Create the card structure using a template literal
    const cardHTML = `
        <div class="card">
            <img src="${item.image}" alt="${item.title}" class="card-img">
            <div class="card-body">
                <h3 class="card-title">${item.title}</h3>
                <p class="card-text">${item.description}</p>
                <a href="${item.link}" class="card-btn">Read More</a>
            </div>
        </div>
    `;
    
    // Append the newly created card markup inside the container
    container.innerHTML += cardHTML;
});

    </script>
</body>
</html>
