<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <link
        rel="stylesheet"
        href="https://cdn.jsdelivr.net/npm/swiper@11/swiper-bundle.min.css"
    >

    <title>Infinite Image Slider</title>

    <style>

        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            padding: 40px;
            background: #f5f5f5;
        }


        /* ==============================
           SWIPER
        ============================== */

        .mySwiper {
            width: 800px;
            height: 300px;

            position: relative;
        }


        .swiper-slide {
            width: 400px;
            height: 250px;
        }


        .swiper-slide img {
            width: 100%;
            height: 250px;

            object-fit: cover;

            border-radius: 10px;
        }


        /* ==============================
           NEXT / PREVIOUS BUTTON
        ============================== */

        .swiper-button-next,
        .swiper-button-prev {
            width: 40px;
            height: 40px;

            background: white;

            border-radius: 50%;

            box-shadow: 0 3px 10px rgba(0, 0, 0, 0.2);
        }


        /* Arrow size */

        .swiper-button-next::after,
        .swiper-button-prev::after {
            font-size: 18px;
            font-weight: bold;
            color: rgb(41, 47, 241);
        }


        /* ==============================
           DOTS
        ============================== */

        .swiper-pagination {
            bottom: 0 !important;
        }


        .swiper-pagination-bullet {
            width: 10px;
            height: 10px;

            opacity: 1;

            background: #aaa;
        }


        .swiper-pagination-bullet-active {
            background: rgb(49, 35, 252);

            width: 25px;

            border-radius: 10px;
        }


        /* ==============================
           MOBILE
        ============================== */

        @media screen and (max-width: 850px) {

            body {
                padding: 20px;
            }

            .mySwiper {
                width: 100%;
            }

            .swiper-slide {
                width: 50%;
            }

        }


        @media screen and (max-width: 600px) {

            .mySwiper {
                height: 300px;
            }

            .swiper-slide {
                width: 100%;
            }

        }

    </style>

</head>


<body>


    <!-- =================================
         SWIPER
    ================================== -->

    <div class="swiper mySwiper">

        <div class="swiper-wrapper">


            <div class="swiper-slide">
                <img src="img/Rectangle 23.png" alt="">
            </div>


            <div class="swiper-slide">
                <img src="img/Rectangle 24.png" alt="">
            </div>


            <div class="swiper-slide">
                <img src="img/Rectangle 25.png" alt="">
            </div>


            <div class="swiper-slide">
                <img src="img/Rectangle 26.png" alt="">
            </div>


        </div>


        <!-- Previous Button -->

        <div class="swiper-button-prev"></div>


        <!-- Next Button -->

        <div class="swiper-button-next"></div>


        <!-- Dots -->

        <div class="swiper-pagination"></div>

    </div>



    <!-- =================================
         SWIPER JS
    ================================== -->

    <script src="https://cdn.jsdelivr.net/npm/swiper@11/swiper-bundle.min.js"></script>


    <script>

        const swiper = new Swiper(".mySwiper", {

            /* Show 2 images */

            slidesPerView: 2,

            spaceBetween: 10,


            /* Infinite loop */

            loop: true,


            /* Auto slide */

            autoplay: {

                delay: 3000,

                disableOnInteraction: false

            },


            /* Slow movement */

            speed: 1500,


            /* Previous / Next */

            navigation: {

                nextEl: ".swiper-button-next",

                prevEl: ".swiper-button-prev"

            },


            /* Dots */

            pagination: {

                el: ".swiper-pagination",

                clickable: true

            }

        });

    </script>


</body>

</html>
