<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Toy Store</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: Arial, sans-serif;
        }

        body {
            background: #f7f7f7;
            padding: 30px;
        }

        .title {
            text-align: center;
            margin-bottom: 30px;
        }

        .title h1 {
            font-size: 32px;
            margin-bottom: 8px;
        }

        .title p {
            color: #777;
        }

        /* Product container */
        .products {
            max-width: 1200px;
            margin: auto;

            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 25px;
        }

        /* Product card */
        .card {
            background: white;
            border-radius: 18px;
            padding: 15px;
            position: relative;

            box-shadow: 0 5px 20px rgba(0, 0, 0, 0.08);

            transition: 0.3s;
        }

        .card:hover {
            transform: translateY(-5px);
            box-shadow: 0 10px 25px rgba(0, 0, 0, 0.12);
        }

        /* Image area */
        .image-box {
            position: relative;
            width: 100%;
            height: 300px;
            overflow: hidden;
            border-radius: 15px;
        }

        .product-img {
            width: 100%;
            height: 100%;
            object-fit: cover;

            transition: 0.4s;
        }

        .card:hover .product-img {
            transform: scale(1.05);
        }

        /* Like button */
        .like-btn {
            position: absolute;
            top: 15px;
            right: 15px;

            width: 45px;
            height: 45px;

            border: none;
            border-radius: 50%;

            background: white;

            display: flex;
            align-items: center;
            justify-content: center;

            cursor: pointer;

            box-shadow: 0 3px 10px rgba(0, 0, 0, 0.15);

            transition: 0.2s;
        }

        .like-btn:hover {
            transform: scale(1.1);
        }

        .like-btn img {
            width: 23px;
            height: 23px;
        }

        /* Product details */
        .details {
            padding: 15px 5px 5px;
        }

        .details h2 {
            font-size: 20px;
            margin-bottom: 10px;
            color: #222;
        }

        .price {
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .new-price {
            font-size: 20px;
            font-weight: bold;
            color: #222;
        }

        .old-price {
            color: #999;
            text-decoration: line-through;
        }

        /* Star */
        .rating {
            display: flex;
            align-items: center;
            gap: 5px;
            margin-top: 10px;
        }

        .rating img {
            width: 18px;
            height: 18px;
        }

        .rating span {
            color: #777;
            font-size: 14px;
        }

        /* Cart button */
        .cart-btn {
            width: 100%;
            margin-top: 15px;
            padding: 12px;

            border: none;
            border-radius: 10px;

            background: #222;
            color: white;

            font-size: 16px;
            cursor: pointer;

            display: flex;
            justify-content: center;
            align-items: center;
            gap: 8px;

            transition: 0.3s;
        }

        .cart-btn:hover {
            background: #444;
        }

        .cart-btn img {
            width: 20px;
            height: 20px;
            filter: brightness(0) invert(1);
        }

        /* Mobile */
        @media screen and (max-width: 700px) {

            body {
                padding: 15px;
            }

            .products {
                grid-template-columns: 1fr;
                gap: 20px;
            }

            .image-box {
                height: 280px;
            }

            .title h1 {
                font-size: 26px;
            }
        }
    </style>
</head>

<body>

    <div class="title">
        <h1>Our Toys</h1>
        <p>Choose your favourite toy</p>
    </div>


    <!-- Products will be displayed here -->
    <div class="products" id="products"></div>


    <script>

        /* =========================================
           PRODUCT ARRAY
        ========================================= */

        const carddetails = [

            {
                id: 1,
                name: "Blocks Shape-Sorting Toy",
                imgback: "toppicks/image 11.png",
                rate: "$29.00",
                oldrate: "$39.00",
                star: "svg/Vector (1).png",
                heart: "svg/heart.svg",
                heartFill: "svg/heartfill.svg",
                cart: "svg/shopping-cart.svg"
            },

            {
                id: 2,
                name: "Building Blocks Toy",
                imgback: "toppicks/image 12.png",
                rate: "$25.00",
                oldrate: "$35.00",
                star: "svg/Vector (1).png",
                heart: "svg/heart.svg",
                heartFill: "svg/heartfill.svg",
                cart: "svg/shopping-cart.svg"
            },

            {
                id: 3,
                name: "Colorful Learning Toy",
                imgback: "toppicks/image 13.png",
                rate: "$32.00",
                oldrate: "$42.00",
                star: "svg/Vector (1).png",
                heart: "svg/heart.svg",
                heartFill: "svg/heartfill.svg",
                cart: "svg/shopping-cart.svg"
            },

            {
                id: 4,
                name: "Kids Educational Toy",
                imgback: "toppicks/image 14.png",
                rate: "$20.00",
                oldrate: "$30.00",
                star: "svg/Vector (1).png",
                heart: "svg/heart.svg",
                heartFill: "svg/heartfill.svg",
                cart: "svg/shopping-cart.svg"
            }

        ];


        /* =========================================
           GET SAVED LIKE DATA
        ========================================= */

        let likedProducts =
            JSON.parse(localStorage.getItem("likedProducts")) || {};


        /* =========================================
           DISPLAY PRODUCTS
        ========================================= */

        function displayProducts() {

            const products = document.getElementById("products");

            products.innerHTML = "";


            carddetails.forEach(function(item) {

                const isLiked = likedProducts[item.id] === true;


                products.innerHTML += `

                    <div class="card">

                        <div class="image-box">

                            <img
                                class="product-img"
                                src="${item.imgback}"
                                alt="${item.name}"
                            >


                            <!-- LIKE BUTTON -->

                            <button
                                class="like-btn"
                                onclick="toggleLike(${item.id})"
                            >

                                <img
                                    src="${isLiked ? item.heartFill : item.heart}"
                                    alt="Like"
                                >

                            </button>

                        </div>


                        <div class="details">

                            <h2>
                                ${item.name}
                            </h2>


                            <div class="price">

                                <span class="new-price">
                                    ${item.rate}
                                </span>

                                <span class="old-price">
                                    ${item.oldrate}
                                </span>

                            </div>


                            <div class="rating">

                                <img
                                    src="${item.star}"
                                    alt="Rating"
                                >

                                <span>
                                    4.8
                                </span>

                            </div>


                            <button
                                class="cart-btn"
                                onclick="addCart(${item.id})"
                            >

                                <img
                                    src="${item.cart}"
                                    alt="Cart"
                                >

                                Add to Cart

                            </button>

                        </div>

                    </div>

                `;
            });
        }


        /* =========================================
           LIKE / UNLIKE
        ========================================= */

        function toggleLike(id) {

            if (likedProducts[id] === true) {

                // Unlike
                likedProducts[id] = false;

            } else {

                // Like
                likedProducts[id] = true;

            }


            /* Save to localStorage */

            localStorage.setItem(
                "likedProducts",
                JSON.stringify(likedProducts)
            );


            /* Refresh cards */

            displayProducts();
        }


        /* =========================================
           ADD TO CART
        ========================================= */

        function addCart(id) {

            const product = carddetails.find(
                item => item.id === id
            );

            alert(product.name + " added to cart!");
        }


        /* =========================================
           FIRST LOAD
        ========================================= */

        displayProducts();

    </script>

</body>
</html>
