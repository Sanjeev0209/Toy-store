<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Top Picks</title>

    <style>

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: Arial, sans-serif;
            background: white;
        }

        /* Main container */

        .container {
            width: 92%;
            max-width: 1100px;
            margin: 25px auto;
        }

        /* Heading */

        .title {
            text-align: center;
            margin-bottom: 15px;
        }

        .title h2 {
            font-size: 24px;
            font-weight: 700;
        }

        /* Tabs */

        .tabs {
            display: flex;
            justify-content: center;
            gap: 10px;
            margin-bottom: 20px;
        }

        .tab {
            border: none;
            background: transparent;
            padding: 10px 18px;
            cursor: pointer;
            font-size: 14px;
            border-radius: 20px;
        }

        .tab.active {
            background: #f1f1f1;
        }

        /* Product grid */

        .product-grid {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 20px 12px;
        }

        /* Card */

        .card {
            position: relative;
            min-width: 0;
        }

        /* Image area */

        .image-box {
            position: relative;
            width: 100%;
            height: 150px;
            border: 1px solid #ddd;
            border-radius: 10px;
            overflow: hidden;
            background: #fff;
        }

        .product-image {
            width: 100%;
            height: 100%;
            object-fit: contain;
            padding: 8px;
        }

        /* Sale */

        .sale {
            position: absolute;
            top: 7px;
            left: 7px;
            background: #ff6b6b;
            color: white;
            font-size: 8px;
            padding: 4px 6px;
            border-radius: 5px;
            z-index: 2;
        }

        /* Icons */

        .icons {
            position: absolute;
            top: 7px;
            right: 7px;
            display: flex;
            flex-direction: column;
            gap: 8px;
        }

        .icon {
            width: 18px;
            height: 18px;
            cursor: pointer;
        }

        /* Product name */

        .product-name {
            margin-top: 9px;
            font-size: 12px;
            color: #333;

            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        /* Price */

        .price-area {
            margin-top: 4px;
            display: flex;
            gap: 8px;
            align-items: center;
        }

        .price {
            font-size: 11px;
            font-weight: bold;
        }

        .old-price {
            font-size: 9px;
            color: #999;
            text-decoration: line-through;
        }

        /* Rating */

        .rating {
            margin-top: 5px;
            display: flex;
            align-items: center;
            gap: 2px;
        }

        .star {
            width: 11px;
            height: 11px;
        }

        /* Responsive */

        @media (max-width: 700px) {

            .product-grid {
                grid-template-columns: repeat(2, 1fr);
                gap: 20px 10px;
            }

            .image-box {
                height: 160px;
            }

            .title h2 {
                font-size: 20px;
            }
        }

        @media (max-width: 400px) {

            .product-grid {
                grid-template-columns: repeat(2, 1fr);
            }

            .image-box {
                height: 130px;
            }

            .product-name {
                font-size: 10px;
            }
        }

    </style>
</head>

<body>

    <div class="container">

        <div class="title">
            <h2>Top Picks for your little ones</h2>
        </div>

        <div class="tabs">

            <button class="tab active" onclick="filterProducts('featured', this)">
                Featured
            </button>

            <button class="tab" onclick="filterProducts('bestseller', this)">
                Best seller
            </button>

            <button class="tab" onclick="filterProducts('new', this)">
                New arrivals
            </button>

        </div>

        <!-- Products will come here -->
        <div class="product-grid" id="productGrid"></div>

    </div>


    <script>

        /* =====================================
           PRODUCT ARRAY
        ===================================== */

        const carddetails = [

            {
                id: 1,
                name: "Blocks shape-sorting Toy",
                image: "toppicks/image 11.png",

                price: "$29.00",
                oldPrice: "",

                sale: true,

                rating: 5,

                category: "featured",

                star: "svg/Vector (1).png",
                heart: "svg/heart.svg",
                cart: "svg/shopping-cart.svg"
            },

            {
                id: 2,
                name: "Magno etiamo tempor orci",
                image: "toppicks/image 11 (11).png",

                price: "$39.00",
                oldPrice: "$49.00",

                sale: true,

                rating: 5,

                category: "featured",

                star: "svg/Vector.png",
                heart: "svg/heart.svg",
                cart: "svg/shopping-cart.svg"
            },

            {
                id: 3,
                name: "Magno etiamo tempor orci",
                image: "toppicks/image 11 (12).png",

                price: "$39.00",
                oldPrice: "",

                sale: false,

                rating: 5,

                category: "bestseller",

                star: "svg/Vector (1).png",
                heart: "svg/heart.svg",
                cart: "svg/shopping-cart.svg"
            },

            {
                id: 4,
                name: "Magno etiamo tempor orci",
                image: "toppicks/image 11 (13).png",

                price: "$39.00",
                oldPrice: "",

                sale: false,

                rating: 5,

                category: "bestseller",

                star: "svg/Vector.png",
                heart: "svg/heart.svg",
                cart: "svg/shopping-cart.svg"
            },

            {
                id: 5,
                name: "Magno etiamo tempor orci",
                image: "toppicks/image 11 (2).png",

                price: "$29.00",
                oldPrice: "",

                sale: true,

                rating: 5,

                category: "new",

                star: "svg/Vector (1).png",
                heart: "svg/heart.svg",
                cart: "svg/shopping-cart.svg"
            },

            {
                id: 6,
                name: "Moore etiamo tempor orci",
                image: "toppicks/image 11 (14).png",

                price: "$39.00",
                oldPrice: "",

                sale: false,

                rating: 5,

                category: "new",

                star: "svg/Vector.png",
                heart: "svg/heart.svg",
                cart: "svg/shopping-cart.svg"
            },

            {
                id: 7,
                name: "Hooo scoot-around",
                image: "toppicks/image 11 (15).png",

                price: "$29.00",
                oldPrice: "$39.00",

                sale: true,

                rating: 5,

                category: "featured",

                star: "svg/Vector (1).png",
                heart: "svg/heart.svg",
                cart: "svg/shopping-cart.svg"
            },

            {
                id: 8,
                name: "Moore etiamo tempor orci",
                image: "toppicks/image 11 (16).png",

                price: "$39.00",
                oldPrice: "",

                sale: false,

                rating: 5,

                category: "new",

                star: "svg/Vector.png",
                heart: "svg/heart.svg",
                cart: "svg/shopping-cart.svg"
            }

        ];


        /* =====================================
           DISPLAY PRODUCTS
        ===================================== */

        function displayProducts(products) {

            const productGrid =
                document.getElementById("productGrid");

            productGrid.innerHTML = "";

            products.forEach(card => {

                /* Create stars */

                let stars = "";

                for (let i = 0; i < card.rating; i++) {

                    stars += `
                        <img 
                            class="star"
                            src="${card.star}"
                            alt="star"
                        >
                    `;

                }


                /* Create sale label */

                let saleHTML = "";

                if (card.sale) {

                    saleHTML = `
                        <span class="sale">
                            SALE
                        </span>
                    `;

                }


                /* Create old price */

                let oldPriceHTML = "";

                if (card.oldPrice) {

                    oldPriceHTML = `
                        <span class="old-price">
                            ${card.oldPrice}
                        </span>
                    `;

                }


                /* Create card */

                productGrid.innerHTML += `

                    <div class="card">

                        <div class="image-box">

                            ${saleHTML}

                            <div class="icons">

                                <img 
                                    src="${card.heart}"
                                    class="icon"
                                    alt="heart"
                                    onclick="addWishlist(${card.id})"
                                >

                                <img 
                                    src="${card.cart}"
                                    class="icon"
                                    alt="cart"
                                    onclick="addCart(${card.id})"
                                >

                            </div>

                            <img
                                src="${card.image}"
                                class="product-image"
                                alt="${card.name}"
                            >

                        </div>


                        <p class="product-name">
                            ${card.name}
                        </p>


                        <div class="price-area">

                            <span 
                                class="price"
                                style="color: ${
                                    card.id % 2 === 0
                                    ? 'red'
                                    : '#42a83f'
                                }"
                            >
                                ${card.price}
                            </span>

                            ${oldPriceHTML}

                        </div>


                        <div class="rating">

                            ${stars}

                        </div>

                    </div>

                `;

            });

        }


        /* =====================================
           TAB FILTER
        ===================================== */

        function filterProducts(category, button) {

            /* Change active button */

            document.querySelectorAll(".tab")
                .forEach(tab => {
                    tab.classList.remove("active");
                });

            button.classList.add("active");


            /* Filter */

            const filteredProducts =
                carddetails.filter(card => {

                    return card.category === category;

                });


            displayProducts(filteredProducts);

        }


        /* =====================================
           CART
        ===================================== */

        function addCart(id) {

            const product =
                carddetails.find(card => card.id === id);

            alert(product.name + " added to cart");

        }


        /* =====================================
           WISHLIST
        ===================================== */

        function addWishlist(id) {

            const product =
                carddetails.find(card => card.id === id);

            alert(product.name + " added to wishlist");

        }


        /* =====================================
           FIRST LOAD
        ===================================== */

        displayProducts(carddetails);

    </script>

</body>
</html>
